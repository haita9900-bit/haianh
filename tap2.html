<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>wed hải anh coder</title>
  <style>
    :root{
      --bg1:#ff5f6d;
      --bg2:#7f00ff;
      --card-bg: rgba(255,255,255,0.9);
      --accent:#246fb3;
      --btn-radius:14px;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html,body{
      height:100%;
      margin:0;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg,var(--bg1),#d26aa6 40%,var(--bg2));
      min-height:100vh;
      color:#111;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      padding:28px;
      box-sizing:border-box;
      position:relative;
    }

    /* Facebook circle top-left */
    .fb-icon{
      position: absolute;
      left:18px;
      top:18px;
      width:52px;
      height:52px;
      border-radius:50%;
      background:#1877f2;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      cursor:pointer;
    }
    .fb-icon svg{ width:22px; height:22px; fill:#fff; }

    .center-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:26px;
      margin-top:20px;
    }

    .laptop-card{
      width:640px;
      max-width:82%;
      background:var(--card-bg);
      padding:18px;
      border-radius:8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .laptop-card img{
      width:100%;
      height:auto;
      display:block;
      border-radius:4px;
      object-fit:cover;
    }

    /* nút liên hệ */
    .contact-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      padding:14px 28px;
      border-radius:28px;
      background: linear-gradient(180deg,#e8f4ff, #d8ecff);
      border: 4px solid rgba(36,111,179,0.85);
      font-weight:600;
      font-size:20px;
      color: #0b2e4a;
      cursor:pointer;
      text-decoration:none;
      box-shadow: 0 8px 18px rgba(36,111,179,0.18);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .contact-btn:active{ transform: translateY(2px); }

    /* small page-chuyển (bottom-right) */
    .goto{
      position: absolute;
      right:18px;
      bottom:18px;
      display:inline-flex;
      gap:.5rem;
      align-items:center;
      padding:10px 14px;
      background: #fff;
      border-radius:999px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.15);
      cursor:pointer;
      text-decoration:none;
      color:#111;
      font-weight:600;
    }

    /* responsive */
    @media (max-width:720px){
      .laptop-card{ padding:12px; }
      .contact-btn{ font-size:18px; padding:12px 22px; }
      .fb-icon{ width:46px; height:46px; left:12px; top:12px; }
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <!-- Facebook icon (click opens Facebook profile) -->
    <a class="fb-icon" href="https://www.facebook.com/hai.ahhhh" target="_blank" rel="noopener noreferrer" title="Mở Facebook">
      <!-- simple 'f' svg -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.07C22 6.49 17.52 2 11.94 2S2 6.49 2 12.07c0 4.99 3.66 9.13 8.44 9.95v-7.04H8.1v-2.91h2.34V9.41c0-2.31 1.37-3.58 3.47-3.58.99 0 2.03.18 2.03.18v2.21h-1.13c-1.12 0-1.47.7-1.47 1.42v1.7h2.5l-.4 2.91h-2.1v7.04C18.34 21.2 22 17.07 22 12.07z"/></svg>
    </a>

    <div class="center-area" aria-live="polite">
      <!-- Laptop image card -->
      <div class="laptop-card" role="img" aria-label="Hình laptop hiển thị trang Facebook">
        <!-- Thay src bằng đường dẫn ảnh của bạn hoặc url -->
        <img src="./wallpapersden.com_satoru-gojo-jujutsu-kaisen-fortnite_1920x1080.jpg"
             alt="Laptop mở trang Facebook (ví dụ)">
      </div>

      <!-- Nút liên hệ: mở Facebook profile (mở tab mới) -->
      <a class="contact-btn" id="contactBtn" href="https://www.facebook.com/hai.ahhhh" target="_blank" rel="noopener noreferrer">
        liên hệ in4
      </a>
    </div>

    <!-- Nút chuyển trang nội bộ -> other.html -->
    <a class="goto" id="gotoBtn" href="tap3.html" title="Chuyển trang">
      trang share code →
    </a>
  </div>

  <script>
    // Thêm hành vi nếu bạn muốn: ví dụ logging / animation
    document.getElementById('contactBtn').addEventListener('click', function(e){
      // target mặc định mở tab mới vì attribute target="_blank"
      console.log('Người dùng nhấn "liên hệ in4" — mở liên kết Facebook.');
    });

    document.getElementById('gotoBtn').addEventListener('click', function(e){
      // mặc định link <a href="other.html"> sẽ chuyển trang
      console.log('Chuyển trang nội bộ sang other.html');
    });
  </script>
</body>
</html>
