<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Online - Trang Chủ</title>
  <style>

.featured-products {
  padding: 40px 0;
  background-color: #f7f7f7;
}

.featured-products h2 {
  text-align: center;
  margin-bottom: 30px;
  color: #333;
  font-size: 24px;
}


.product-list {
  display: flex;
  flex-wrap: wrap;           
  justify-content: center;   
  gap: 20px;                 
  max-width: 1400px;
  margin: 0 auto;
}


.product-item {
  width: calc(20% - 20px);   
  background-color: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  text-align: center;
  padding: 15px;
  transition: all 0.3s ease;
}

.product-item:hover {
  transform: translateY(-5px);
}


.product-item img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  margin-bottom: 10px;
}


.product-item h3 {
  font-size: 16px;
  color: #333;
  margin-bottom: 8px;
}


.product-item .price {
  color: red;
  font-weight: bold;
  margin-bottom: 10px;
}

.product-item .btn {
  background-color: #00b894;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

.product-item .btn:hover {
  background-color: #019875;
}

@media (max-width: 1200px) {
  .product-item {
    width: calc(25% - 20px); 
  }
}

@media (max-width: 900px) {
  .product-item {
    width: calc(33.33% - 20px); 
  }
}

@media (max-width: 600px) {
  .product-item {
    width: calc(50% - 20px); 
  }
}

@media (max-width: 400px) {
  .product-item {
    width: 100%; 
  }
}

    body { margin:0; font-family:Arial, sans-serif; background:#f4f4f4; }
    header { padding:15px; background:#2c3e50; color:white; text-align:center; }
    .products {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
      gap:15px; padding:20px;
    }
    .product-card {
      background:white; border-radius:8px; overflow:hidden;
      box-shadow:0 2px 5px rgba(0,0,0,0.2); text-align:center;
    }
    .product-card img { width:100%; height:160px; object-fit:cover; }
    .product-info { padding:10px; }
    .price { color:#e74c3c; font-weight:bold; margin:8px 0; }
    .buy-btn {
      display:inline-block; padding:8px 12px; background:#1abc9c;
      color:white; text-decoration:none; border-radius:5px; font-size:14px;
    }
    .buy-btn:hover { background:#16a085; }
  </style>
</head>
<body>
  <header><h1>Shopcongnghe5.0</h1></header>
<section class="featured-products">
  <h2>Sản phẩm nổi bật</h2>
  <div class="product-list">
    <div class="product-item">
      <img src="./assets/img/lenovo-legion-7-gen7-1.jpg" alt="Laptop lenovo-legion-7">
      <h3>Lenovo Legion 7 Gen 7</h3>
      <p class="price">60.990.000đ</p>
     <button class="btn" onclick="buyNow('')">Mua ngay</button>
    </div>

    <div class="product-item">
      <img src="./assets/img/2022_asus_tuf_gaming_f15_fx507_jaeger_gray_c8fc1c350e.webp" alt="Laptop ASUS TUF Gaming">
      <h3>ASUS TUF Gaming</h3>
      <p class="price">18.490.000đ</p>
     <button class="btn" onclick="buyNow('')">Mua ngay</button>
    </div>

    <div class="product-item">
      <img src="./assets/img/text_ng_n_47__3_2_1.png" alt="laptop Lenovo LOQ">
      <h3>laptop lenovo LOQ</h3>
      <p class="price">17.990.000đ</p>
      <button class="btn" onclick="buyNow('')">Mua ngay</button>
    </div>

    <div class="product-item">
      <img src="./assets/img/iphone-17-pro-max-xanh-2-638930821911831487-750x500.jpg" alt="iPhone 17 Pro Max">
      <h3>iphone-17-pro-max</h3>
      <p class="price">37.990.000đ</p>
     <button class="btn" onclick="buyNow('')">Mua ngay</button>
    </div>

    <div class="product-item">
      <img src="./assets/img/ipad-pro-13-select-wifi-silver-202210-01.webp" alt="ipad-pro-13">
      <h3>ipad-pro-13</h3>
      <p class="price">19.990.000đ</p>
     <button class="btn" onclick="buyNow('')">Mua ngay</button>
    </div>
  </div>
</section>
<script>
  function buyNow(name, price) {
    const params = new URLSearchParams();
    params.append("name", name);
    params.append("price", price);
    window.location.href = "product.html?" + params.toString();
  }
</script>

</body>
</html>
